name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Check (typecheck + lint + test)
        run: npm run check

      - name: Build web
        run: npm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # 覆盖率报告门禁：阈值在 scripts/run-tests.mjs 与 web/vitest.config.ts 中集中定义。
      - name: Coverage (server)
        run: npm run test:coverage

      - name: Coverage (web)
        run: npm run test:web:coverage

  prod-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # 模拟 Pi 上的生产安装，确认 apps/workbench/server/src 没有引用 devDependencies。
      - name: Install production dependencies only
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Check runtime dependency boundary
        run: node scripts/check-prod-deps.mjs --app-dir apps/workbench

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install (lockfile only)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 只对运行时依赖启用失败门禁；构建期依赖漏洞记录在 Dependabot/人工评估。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck scripts
        run: shellcheck -S warning scripts/*.sh deploy/*.sh

  nftables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables

      # 只做语法/语义校验，不加载规则。
      - name: Check nftables config
        run: sudo nft -c -f deploy/nftables.conf

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PowerShell BOM and syntax (PS 5.1)
        shell: powershell
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1
          if ($files.Count -eq 0) { Write-Error "No PowerShell scripts found"; exit 1 }
          $failed = $false
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $hasBom) {
              Write-Error "Missing UTF-8 BOM (Windows PowerShell 5.1 mojibake): $($file.Name)"
              $failed = $true
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) { Write-Error "$($file.Name): $($parseError.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell 5.1 parse/BOM check passed ($($files.Count) scripts)"
