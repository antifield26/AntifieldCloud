#!/usr/sbin/nft -f
# AntifieldCloud 主机防火墙模板（v0.7.0）：
# - 默认拒绝入站；SSH 仅允许直连网段与校园网段，并限制新建连接速率（SSH 已仅公钥，见 deploy/host/sshd_config.d/）
# - RCON 25575 仅允许 loopback（由 iif lo 放行，其它入站默认丢弃）
# - Minecraft 25565 仅允许直连网段/校园网段（nginx 80 旧入口已移除）
# - 出站不限制，保证 cloudflared/opencode/Minecraft 正常
#
# ⚠ 安装前必须替换占位网段（TEST-NET 仅占位，直接安装会导致 SSH/Minecraft 不可达）：
#   - 192.0.2.0/24    → 实际直连网段（见 .local/DEPLOYMENT.md）
#   - 198.51.100.0/24 → 实际校园网/无线网段
#   替换前先确认“当前 SSH 来源”落在替换后的允许集合内，并保留物理键鼠/已建立 SSH 作为回滚通道。
# 回滚：恢复 /etc/nftables.conf.bak 后 `systemctl restart nftables`（随后 `systemctl restart fail2ban` 恢复封禁 set）。
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # DHCP 客户端续租（只允许从实际网卡进入）
    iifname { "eth0", "wlan0" } udp dport 68 accept

    # SSH：直连网段 + 校园网段（占位值，安装前替换）；新建连接限速，防暴力破解。
    # burst 40 容纳 smoke/备份脚本的多次 SSH；仍远低于暴力破解所需速率。
    ip saddr { 192.0.2.0/24, 198.51.100.0/24 } tcp dport 22 ct state new limit rate 20/minute burst 40 packets accept

    # Minecraft：仅直连网段与校园网段（占位值，安装前替换）。
    ip saddr { 192.0.2.0/24, 198.51.100.0/24 } tcp dport 25565 accept
    ip6 saddr fe80::/10 tcp dport 25565 accept

    # RCON 永远不允许从非 loopback 进入（显式 drop 便于审计）
    tcp dport 25575 drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
