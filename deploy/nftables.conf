#!/usr/sbin/nft -f
# AntifieldCloud 主机防火墙（v0.4.0 收窄 SSH 与 Minecraft 入站范围）：
# - 默认拒绝入站；SSH 仅允许直连网段与校园网段，并限制新建连接速率（按用户选择保留密码登录，建议后续改公钥）
# - RCON 25575 仅允许 loopback（由 iif lo 放行，其它入站默认丢弃）
# - Minecraft 25565 仅允许直连网段/校园网段（nginx 80 旧入口已移除）
# - 出站不限制，保证 cloudflared/opencode/Minecraft 正常
# 回滚：恢复 /etc/nftables.conf.bak 后 `systemctl restart nftables`。
# 注意：修改 22/25565 来源网段前，先确认管理员当前连接来源在允许集合内，否则会失去 SSH。
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # DHCP 客户端续租（只允许从实际网卡进入）
    iifname { "eth0", "wlan0" } udp dport 68 accept

    # SSH：直连 169.254.77.0/24 与校园网 172.23.88.0/21；新建连接限速，防暴力破解。
    # burst 40 容纳 smoke/备份脚本的多次 SSH；仍远低于暴力破解所需速率。
    ip saddr { 169.254.77.0/24, 172.23.88.0/21 } tcp dport 22 ct state new limit rate 20/minute burst 40 packets accept

    # Minecraft：仅直连网段与校园网段。
    ip saddr { 169.254.77.0/24, 172.23.88.0/21 } tcp dport 25565 accept
    ip6 saddr fe80::/10 tcp dport 25565 accept

    # RCON 永远不允许从非 loopback 进入（显式 drop 便于审计）
    tcp dport 25575 drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
