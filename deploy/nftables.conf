#!/usr/sbin/nft -f
# AntifieldCloud 主机防火墙：
# - 默认拒绝入站；SSH 全放行（按用户选择保留密码登录，建议后续改公钥）
# - RCON 25575 仅允许 loopback（由 iif lo 放行，其它入站默认丢弃）
# - Minecraft 25565 与 nginx 80 仅允许直连网段/校园网段
# - 出站不限制，保证 cloudflared/opencode/Minecraft 正常
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # DHCP 客户端续租（WiFi 由 NetworkManager 管理）
    udp dport 68 accept

    # SSH：保留远程管理；使用公钥认证
    tcp dport 22 accept

    # 仅直连网段与校园网可访问 Minecraft / nginx 默认站
    ip saddr { 169.254.0.0/16, 198.51.100.0/24 } tcp dport { 80, 25565 } accept
    ip6 saddr fe80::/10 tcp dport { 80, 25565 } accept

    # RCON 永远不允许从非 loopback 进入（显式 drop 便于审计）
    tcp dport 25575 drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
