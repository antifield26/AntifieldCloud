# AntifieldCloud 主机 SSH 加固（OPS-09 模板；安装到 /etc/ssh/sshd_config.d/）
# 注意：drop-in 文件名以 00- 开头，先于其它配置生效；应用前保留已建立的 SSH 会话作为回滚通道。
# 占位：<SSH_USER> 替换为实际运维用户（示例 antifield）。
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
AllowUsers <SSH_USER>
