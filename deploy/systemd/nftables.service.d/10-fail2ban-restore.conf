# nftables 重载/重启会清空 fail2ban 的 inet f2b-table，导致已封禁 IP 立即解封。
# fail2ban 的 dbfile（/var/lib/fail2ban/fail2ban.sqlite3）会持久化封禁记录。
# 启动完成后延迟 3 秒异步重启 fail2ban，从数据库恢复 set；不能同步 restart：
# 同步 job 会等待 nftables 自身启动作业，形成 ordering 死锁。
# 手工 `systemctl reload nftables` 不触发 ExecStartPost，需执行
# `systemctl restart fail2ban`（见 docs/app/DEPLOY.md §9.7）。
[Service]
ExecStartPost=-/bin/sh -c '/bin/systemd-run --collect --on-active=3 --unit=nftables-f2b-restore /bin/systemctl restart fail2ban.service'
