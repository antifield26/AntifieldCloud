<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="robots" content="noindex" />
    <title>离线 · AntifieldComplexx</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0e14;
        --surface: #121a24;
        --border: #1f2b3a;
        --text: #e6edf3;
        --text-muted: #93a4b8;
        --text-dim: #6b7d92;
        --accent: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(900px 480px at 20% -10%, rgba(34, 211, 238, 0.07), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        margin-bottom: 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, #67e8f9, #22d3ee 45%, #3b82f6);
        color: #04222b;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
      p { margin: 0 0 20px; color: var(--text-muted); font-size: 13px; line-height: 1.6; }
      .reload {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 18px;
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: 9px;
        background: linear-gradient(180deg, #4adee8, #06b6d4);
        color: #04222b;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .foot { margin-top: 18px; color: var(--text-dim); font-size: 11.5px; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">AC</span>
      <h1>当前处于离线状态</h1>
      <p>网络不可用，无法加载实时数据。已缓存的静态资源仍可访问，恢复网络后请刷新页面。</p>
      <a class="reload" href="/">重新加载</a>
      <p class="foot">AntifieldComplexx · 个人工作台</p>
    </main>
  </body>
</html>
